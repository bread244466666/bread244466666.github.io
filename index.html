<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER NET ARENA - FPS MULTIPLAYER</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #06080d;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            color: #d1d9e6;
        }

        /* 1. LOBBY UI - ENTERING THE ARENA (初始大廳 UI 面板) */
        #lobby-ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 420px;
            background: rgba(10, 14, 23, 0.96);
            border: 2px solid #00ffaa;
            box-shadow: 0 0 35px rgba(0, 255, 170, 0.25);
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            z-index: 9000;
        }
        .ui-header {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 25px;
            color: #00ffaa;
            text-shadow: 0 0 12px rgba(0, 255, 170, 0.6);
        }
        .ui-subtitle {
            font-size: 11px;
            color: #697c9a;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            border-bottom: 1px dashed #223147;
            padding-bottom: 10px;
        }
        .input-group {
            margin-bottom: 30px;
            text-align: left;
        }
        .input-label {
            font-size: 11px;
            color: #00ffaa;
            margin-bottom: 8px;
            display: block;
            letter-spacing: 1px;
        }
        input[type="text"] {
            width: 100%;
            padding: 15px;
            background: #0d121c;
            border: 1px solid #1f2d42;
            color: #ffffff;
            font-size: 16px;
            font-family: inherit;
            border-radius: 4px;
            outline: none;
            text-align: center;
        }
        .action-button {
            width: 100%;
            padding: 16px;
            background: #00ffaa;
            border: none;
            color: #05070a;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 170, 0.2);
        }
        .action-button:hover {
            background: #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 170, 0.5);
        }

        /* 2. WEAPON MENU - LOADOUT SELECTION (武器出擊部署選單) */
        #weapon-menu {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 460px;
            background: rgba(8, 10, 15, 0.98);
            border: 2px solid #ffaa00;
            box-shadow: 0 0 40px rgba(255, 170, 0, 0.3);
            padding: 35px;
            border-radius: 8px;
            z-index: 8000;
            text-align: center;
        }
        .weapon-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }
        .weapon-card {
            background: #111520;
            border: 1px solid #ffaa00;
            color: #ffaa00;
            padding: 18px 25px;
            font-size: 15px;
            font-family: inherit;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .weapon-card:hover {
            background: #ffaa00;
            color: #05070a;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.4);
        }
        .weapon-desc {
            font-size: 11px;
            opacity: 0.8;
        }

        /* 3. IN-GAME HUD (戰場抬頭顯示器) */
        #hud-container {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 320px;
            z-index: 500;
            pointer-events: none;
            display: none;
        }
        .hud-header {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 2px 2px 2px #000;
        }
        .health-track {
            width: 100%;
            height: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
            padding: 1px;
        }
        .health-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff2233, #ff5566);
            transition: width 0.1s linear;
        }

        /* 畫面中央精準準星 */
        #tactical-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1000;
            display: none;
        }
        .crosshair-center {
            position: absolute;
            top: 6px;
            left: 6px;
            width: 4px;
            height: 4px;
            background: #00ffaa;
            border-radius: 50%;
            box-shadow: 0 0 4px #00ffaa;
        }

        /* 實時擊殺公告流 */
        #kill-feed-box {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 350px;
            max-height: 200px;
            overflow: hidden;
            z-index: 600;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }
        .kill-msg {
            background: rgba(12, 17, 26, 0.85);
            border-right: 4px solid #ff3344;
            padding: 8px 15px;
            font-size: 12px;
            animation: slideIn 0.2s ease forwards;
            text-shadow: 1px 1px 1px #000;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="lobby-ui">
        <div class="ui-header">CYBER ARENA</div>
        <div class="ui-subtitle">Multiplayer FPS Stable Mode</div>
        <div class="input-group">
            <label class="input-label">AGENT IDENTIFICATION TAG</label>
            <input type="text" id="player-name" value="Agent_Tactical" maxlength="14">
        </div>
        <button class="action-button" onclick="executeGlobalJoinQueue()">建立 / 加入房間 (MAKE ROOM)</button>
    </div>

    <div id="weapon-menu">
        <div class="ui-header" style="color: #ffaa00;">LOADOUT MANIFEST</div>
        <div class="ui-subtitle" style="border-color: #402c05;">Select Weapon System to Deploy</div>
        <div class="weapon-list">
            <button class="weapon-card" onclick="executeGlobalDeploy('RIFLE')">
                <span>RIFLE / 突擊步槍</span><span class="weapon-desc">[AUTOMATIC]</span>
            </button>
            <button class="weapon-card" onclick="executeGlobalDeploy('SHOTGUN')">
                <span>SHOTGUN / 散彈槍</span><span class="weapon-desc">[BURST]</span>
            </button>
            <button class="weapon-card" onclick="executeGlobalDeploy('SNIPER')">
                <span>SNIPER / 狙擊槍</span><span class="weapon-desc">[ONE-SHOT]</span>
            </button>
        </div>
    </div>

    <div id="hud-container">
        <div class="hud-header">
            <span>TEAM: <span id="hud-team-tag" style="color: #00ffaa;">-</span></span>
            <span>HP: <span id="hud-hp-val" style="color: #ff3344;">100</span></span>
        </div>
        <div class="health-track">
            <div id="hud-hp-bar" class="health-fill"></div>
        </div>
    </div>

    <div id="tactical-crosshair">
        <div class="crosshair-center"></div>
    </div>

    <div id="kill-feed-box"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        // 觸發前端大廳入口函數
        function executeGlobalJoinQueue() {
            if (typeof window.joinQueue === 'function') {
                window.joinQueue();
            } else {
                alert("錯誤：找不到 app.js 內宣告的 joinQueue 函數，請確保 app.js 與此檔案位於同一個目錄下。");
            }
        }

        // 觸發武器部署與 HUD 展示
        function executeGlobalDeploy(weaponType) {
            if (typeof window.deployAgent === 'function') {
                window.deployAgent(weaponType);
                document.getElementById('hud-container').style.display = 'block';
                document.getElementById('tactical-crosshair').style.display = 'block';
            }
        }

        // 監聽並攔截 Socket 通訊來動態更新 HTML 的網頁 HUD 與擊殺看板
        window.addEventListener('load', () => {
            if (typeof io !== 'undefined') {
                // 由於 socket 變數通常在 app.js 中初始化，我們在一秒後綁定事件監聽
                setTimeout(() => {
                    const activeSocket = window.socket || (typeof socket !== 'undefined' ? socket : null);
                    if (activeSocket) {
                        // 監聽擊殺流
                        activeSocket.on('killFeed', (data) => {
                            const box = document.getElementById('kill-feed-box');
                            if (box) {
                                const item = document.createElement('div');
                                item.className = 'kill-msg';
                                item.innerHTML = `<span style="color:#ff3344;">${data.attackerName}</span> 🎯 eliminated <span style="color:#00ffaa;">${data.targetName}</span>`;
                                box.appendChild(item);
                                setTimeout(() => item.remove(), 4000);
                            }
                        });

                        // 監聽受傷血條同步
                        activeSocket.on('playerHurt', (data) => {
                            if (data.id === activeSocket.id) {
                                const hpVal = document.getElementById('hud-hp-val');
                                const hpBar = document.getElementById('hud-hp-bar');
                                if (hpVal) hpVal.innerText = data.hp;
                                if (hpBar) hpBar.style.width = data.hp + '%';
                            }
                        });

                        // 監聽並同步隊伍標籤
                        activeSocket.on('init', (data) => {
                            const teamTag = document.getElementById('hud-team-tag');
                            if (teamTag) teamTag.innerText = data.team;
                        });
                    }
                }, 1000);
            }
        });
    </script>

    <script src="app.js" defer></script>

</body>
</html>

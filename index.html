<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER ARENA - FPS MULTIPLAYER</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c0f17;
            font-family: Arial, sans-serif;
            color: #ffffff;
        }

        /* 初始大廳 UI：層級設定為最高 9999 確保點擊 */
        #lobby-ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            background: rgb(20, 26, 38);
            border: 2px solid #00ffaa;
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            z-index: 9999;
            display: block;
        }
        .ui-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #00ffaa;
            letter-spacing: 2px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #141a26;
            border: 1px solid #323f57;
            color: #ffffff;
            font-size: 16px;
            border-radius: 4px;
            margin-bottom: 24px;
            text-align: center;
            outline: none;
        }
        .menu-btn {
            width: 100%;
            padding: 14px;
            background: #00ffaa;
            border: none;
            color: #000000;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .menu-btn:hover {
            background: #00ffcc;
        }

        /* 武器部署選單：初始狀態強制隱藏 */
        #weapon-menu {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            background: rgb(20, 26, 38);
            border: 2px solid #ffaa00;
            padding: 35px;
            border-radius: 8px;
            text-align: center;
            z-index: 9998;
        }
        .weapon-btn {
            width: 100%;
            padding: 14px;
            background: #1a2333;
            border: 1px solid #ffaa00;
            color: #ffaa00;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .weapon-btn:hover {
            background: #ffaa00;
            color: #000000;
        }

        /* 戰場 HUD 抬頭顯示 */
        #hud-container {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 300px;
            z-index: 500;
            pointer-events: none;
            display: none;
        }
        .hud-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .hp-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        .hp-bar-fill {
            width: 100%;
            height: 100%;
            background: #ff3344;
            transition: width 0.1s ease;
        }

        /* 正中央十字準星 */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1000;
            display: none;
        }
        .crosshair-dot {
            width: 4px;
            height: 4px;
            background: #00ffaa;
            border-radius: 50%;
            margin: 3px;
        }

        /* 擊殺公告流 */
        #kill-feed {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            z-index: 600;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: flex-end;
        }
        .feed-item {
            background: rgba(15, 20, 31, 0.85);
            padding: 6px 12px;
            font-size: 12px;
            border-right: 4px solid #ff3344;
            border-radius: 2px 0 0 2px;
        }
    </style>
</head>
<body>

    <div id="lobby-ui">
        <div class="ui-title">CYBER ARENA</div>
        <input type="text" id="player-name" value="Agent_01" maxlength="12">
        <button class="menu-btn" onclick="triggerJoinQueue()">建立 / 加入房間 (JOIN ROOM)</button>
    </div>

    <div id="weapon-menu">
        <div class="ui-title" style="color: #ffaa00;">SELECT WEAPON</div>
        <button class="weapon-btn" onclick="triggerDeploy('RIFLE')">RIFLE (突擊步槍)</button>
        <button class="weapon-btn" onclick="triggerDeploy('SHOTGUN')">SHOTGUN (散彈槍)</button>
        <button class="weapon-btn" onclick="triggerDeploy('SNIPER')">SNIPER (狙擊槍)</button>
    </div>

    <div id="hud-container">
        <div class="hud-text">
            <span>TEAM: <span id="hud-team">-</span></span>
            <span>HP: <span id="hud-hp">100</span></span>
        </div>
        <div class="hp-bar-bg">
            <div id="hp-fill" class="hp-bar-fill"></div>
        </div>
    </div>

    <div id="crosshair">
        <div class="crosshair-dot"></div>
    </div>

    <div id="kill-feed"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        // 大廳按鈕觸發程序
        function triggerJoinQueue() {
            // 優先執行你原本 app.js 裡的連線函數
            if (typeof window.joinQueue === 'function') {
                window.joinQueue();
            }
            
            // 安全機制：如果 app.js 中沒有將函數暴露到 window，直接用通訊實例發送封包
            const currentSocket = window.socket || (typeof socket !== 'undefined' ? socket : null);
            if (currentSocket) {
                const nameInput = document.getElementById('player-name').value;
                currentSocket.emit('joinRoom', { name: nameInput });
            }
        }

        // 部署出擊按鈕觸發程序
        function triggerDeploy(weaponType) {
            // 點擊後，無條件在 HTML 端立即隱藏武器選單，防止阻擋 3D 滑鼠視角控制
            document.getElementById('weapon-menu').style.display = 'none';
            
            // 開啟十字準星與血量 HUD
            document.getElementById('hud-container').style.display = 'block';
            document.getElementById('crosshair').style.display = 'block';

            if (typeof window.deployAgent === 'function') {
                window.deployAgent(weaponType);
            } else {
                const currentSocket = window.socket || (typeof socket !== 'undefined' ? socket : null);
                if (currentSocket) {
                    currentSocket.emit('selectWeaponAndDeploy', { weapon: weaponType });
                }
            }
        }

        // 獨立網路攔截層：專門用來強制切換 UI DOM 物件狀態
        window.addEventListener('load', () => {
            if (typeof io !== 'undefined') {
                const checkSocketLoop = setInterval(() => {
                    const currentSocket = window.socket || (typeof socket !== 'undefined' ? socket : null);
                    if (currentSocket) {
                        clearInterval(checkSocketLoop);
                        console.log("[UI SYSTEM] Network core hooked successfully.");

                        // 核心修復點：一旦接獲伺服器端 init 成功通知，強制隱藏大廳、開啟選單
                        currentSocket.on('init', (data) => {
                            console.log("[UI SYSTEM] Arena joined. Switching display visibility.");
                            document.getElementById('lobby-ui').style.display = 'none';
                            document.getElementById('weapon-menu').style.display = 'block';
                            
                            const teamText = document.getElementById('hud-team');
                            if (teamText) teamText.innerText = data.team;
                        });

                        // 傷害與治癒血條同步
                        currentSocket.on('playerHurt', (data) => {
                            if (data.id === currentSocket.id) {
                                const hpText = document.getElementById('hud-hp');
                                const hpFill = document.getElementById('hp-fill');
                                if (hpText) hpText.innerText = data.hp;
                                if (hpFill) hpFill.style.width = data.hp + '%';
                            }
                        });

                        // 被擊殺後死亡，重新彈回武器部署介面
                        currentSocket.on('playerDead', (data) => {
                            if (data.id === currentSocket.id) {
                                document.getElementById('hud-container').style.display = 'none';
                                document.getElementById('crosshair').style.display = 'none';
                                document.getElementById('weapon-menu').style.display = 'block';
                            }
                        });

                        // 擊殺流動態生成
                        currentSocket.on('killFeed', (data) => {
                            const feedBox = document.getElementById('kill-feed');
                            if (feedBox) {
                                const feed = document.createElement('div');
                                feed.className = 'feed-item';
                                feed.innerHTML = `<span style="color:#ff3344;">${data.attackerName}</span> 🎯 ${data.targetName}`;
                                feedBox.appendChild(feed);
                                setTimeout(() => feed.remove(), 4000);
                            }
                        });
                    }
                }, 100);
            }
        });
    </script>

    <script src="app.js" defer></script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER ARENA - MULTIPLAYER FPS</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0b10;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
        }
        /* 1. 初始大廳大廳 UI 面板 */
        #lobby-ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            background: rgba(16, 20, 30, 0.9);
            border: 2px solid #00ffaa;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.2);
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            z-index: 5000;
        }
        h2 {
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #00ffaa;
            text-shadow: 0 0 8px rgba(0,255,170,0.4);
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #1a1f2c;
            border: 1px solid #3a4454;
            color: #fff;
            font-size: 16px;
            border-radius: 4px;
            margin-bottom: 20px;
            outline: none;
            text-align: center;
        }
        input[type="text"]:focus {
            border-color: #00ffaa;
            box-shadow: 0 0 8px rgba(0,255,170,0.2);
        }
        button {
            width: 100%;
            padding: 14px;
            background: #00ffaa;
            border: none;
            color: #0a0b10;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #00cc88;
            box-shadow: 0 0 15px rgba(0,255,170,0.4);
        }
        /* 2. 戰術武器出擊部署選單 */
        #weapon-menu {
            display: none; /* 初始隱藏，加入房間後由 app.js 控制開啟 */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            background: rgba(10, 12, 18, 0.95);
            border: 2px solid #ffaa00;
            box-shadow: 0 0 25px rgba(255, 170, 0, 0.25);
            padding: 30px;
            border-radius: 6px;
            z-index: 4000;
            text-align: center;
        }
        .weapon-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .w-btn {
            background: #1a1f2c;
            border: 1px solid #ffaa00;
            color: #ffaa00;
            padding: 15px;
            font-size: 15px;
            text-align: left;
            display: flex;
            justify-content: space-between;
        }
        .w-btn:hover {
            background: #ffaa00;
            color: #0a0b10;
        }
        /* 3. 第一人稱 HUD 抬頭顯示器 */
        #game-hud {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 280px;
            z-index: 1000;
            font-family: monospace;
            pointer-events: none;
        }
        .hud-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 16px;
            text-shadow: 1px 1px 2px #000;
        }
        #hp-container {
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            height: 12px;
            border-radius: 2px;
            overflow: hidden;
        }
        #hp-bar {
            width: 100%;
            height: 100%;
            background: #ff3333;
            transition: width 0.1s ease;
        }
        /* 4. 螢幕中央精密十字準星 */
        #game-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 3000;
        }
        .ch-line {
            position: absolute;
            background: #00ffaa;
        }
        .ch-v { width: 2px; height: 8px; left: 9px; }
        .ch-h { width: 8px; height: 2px; top: 9px; }
        .ch-t { top: 0; } .ch-b { bottom: 0; } .ch-l { left: 0; } .ch-r { right: 0; }
    </style>
</head>
<body>

    <div id="lobby-ui">
        <h2>CYBER ARENA</h2>
        <input type="text" id="player-name" value="Agent_Specter" placeholder="輸入特務代號..." autocomplete="off">
        <button id="make-room-btn" onclick="joinQueue()">建立 / 加入房間 (Make a Room)</button>
    </div>

    <div id="weapon-menu">
        <h2 style="color: #ffaa00; text-shadow: 0 0 8px rgba(255,170,0,0.4);">選擇戰術裝備部署</h2>
        <div class="weapon-options">
            <button class="w-btn" onclick="deployAgent('RIFLE')">
                <span>突擊步槍 AR-15 Custom</span><span>[全自動]</span>
            </button>
            <button class="w-btn" onclick="deployAgent('SHOTGUN')">
                <span>戰術散彈槍 M870</span><span>[高近戰爆發]</span>
            </button>
            <button class="w-btn" onclick="deployAgent('SNIPER')">
                <span>重型狙擊槍 AWM</span><span>[遠距一擊致命]</span>
            </button>
        </div>
    </div>

    <div id="game-hud">
        <div class="hud-row">
            <span>TEAM: <span id="hud-team" style="color:#00e5ff">-</span></span>
            <span>HP: <span id="hud-hp" style="color:#ff3333">100</span></span>
        </div>
        <div id="hp-container">
            <div id="hp-bar"></div>
        </div>
    </div>

    <div id="game-crosshair">
        <div class="ch-line ch-v ch-t"></div>
        <div class="ch-line ch-v ch-b"></div>
        <div class="ch-line ch-h ch-l"></div>
        <div class="ch-line ch-h ch-r"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script src="/socket.io/socket.io.js"></script>
    
    <script src="app.js"></script>

</body>
</html>
